name: Prepare approved edition credentials
on: workflow_dispatch
permissions:
  contents: read
jobs:
  encrypt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-pilot
    steps:
      - name: Install sealed-box encryption library
        run: npm install --prefix "$RUNNER_TEMP/credential-transfer" --ignore-scripts --no-audit --no-fund libsodium-wrappers@0.7.15
      - name: Encrypt for the five destination environments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGETS: '[{"repository":"emmettl/allchange","environment":"cloudflare","key_id":"3380204578043523366","key":"Ed0BR4b3+OY8DXSoym8aCr6nIG+vwjILxGZkEoeT3iU="},{"repository":"emmettl/correspondances","environment":"cloudflare","key_id":"3380204578043523366","key":"M/LmXUiUrN8FIYno3s0ABprVFodIE6+SiWtk+FIFpWs="},{"repository":"emmettl/umlauf","environment":"cloudflare","key_id":"3380204578043523366","key":"l8IEFivDnx+sEaNSUgeACey95zoWzyoyJQwPGsRdtHE="},{"repository":"emmettl/norikae","environment":"cloudflare","key_id":"3380204578043523366","key":"WHYTQVuSGZCCNTE68yO1qY/EYGtjxlTPcFwGm4b3NSk="},{"repository":"emmettl/manifest","environment":"cloudflare","key_id":"3380204578043523366","key":"8wVQTfo8jgzNkwtZEpfTMH50uZTSVj/EWkOrhDJn4Ds="}]'
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const sodium = require(process.env.RUNNER_TEMP + '/credential-transfer/node_modules/libsodium-wrappers');
          sodium.ready.then(() => {
            if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error('Missing deployment credential');
            const targets = JSON.parse(process.env.TARGETS);
            const encrypted = targets.map(({repository, environment, key_id, key}) => ({
              repository, environment, key_id,
              encrypted_value: sodium.to_base64(sodium.crypto_box_seal(
                sodium.from_string(process.env.CLOUDFLARE_API_TOKEN),
                sodium.from_base64(key, sodium.base64_variants.ORIGINAL)
              ), sodium.base64_variants.ORIGINAL)
            }));
            fs.writeFileSync(process.env.RUNNER_TEMP + '/encrypted-environments.json', JSON.stringify(encrypted));
          });
          JS
      - name: Return encrypted environment values
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-environments
          path: ${{ runner.temp }}/encrypted-environments.json
          retention-days: 1
