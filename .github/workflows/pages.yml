name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Finish the active validated release; retain only the newest pending push.
  # Cancelling on every push can prevent publication during parallel work.
  cancel-in-progress: false

jobs:
  check:
    outputs:
      service_date: ${{ steps.edition.outputs.service_date }}
      timetable_year: ${{ steps.edition.outputs.timetable_year }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Resolve current Swiss service date
        id: edition
        run: node scripts/service-date.mjs >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check edition boundaries
        run: npm run check:architecture

      - name: Check realtime edge adapter
        run: npm run worker:check && npm run worker:build

      # Catch code and payload regressions before starting the expensive jobs.
      - name: Build committed fixtures and check publication budgets
        run: npm run build && npm run check:bundle && npm run pages:prepare

  e2e:
    needs: check
    name: Browser tests (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chromium took ~15 minutes versus WebKit's ~6 in run 34226664670.
        # Split individual Chromium tests; keep one WebGL worker per machine.
        include:
          - { project: desktop-chromium, browser: chromium, shard: 1, shards: 2 }
          - { project: desktop-chromium, browser: chromium, shard: 2, shards: 2 }
          - { project: iphone-webkit, browser: webkit, shard: 1, shards: 1 }
    env:
      E2E_SUITE: ${{ matrix.project }}-${{ matrix.shard }}
      E2E_PROJECT: ${{ matrix.project }}
      E2E_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Install browser test engine
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Orbital blocks are gitignored and normally generated by prebuild.
      # E2E serves Vite directly, so a clean checkout needs them explicitly.
      - name: Prepare orbital browser fixtures
        run: npm run data:orbital

      # Renderer assertions inspect Vite's development R3F module. Each runner
      # retains the committed demo fixtures, independently of the live refresh.
      - name: Browser regression tests
        id: e2e
        run: npm run test:e2e:ci -- --project="$E2E_PROJECT" --shard="$E2E_SHARD" --workers=1
      - name: Upload E2E report, screenshots and traces
        id: e2e-report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Link E2E report in run summary
        if: ${{ !cancelled() && steps.e2e-report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.e2e-report.outputs.artifact-url }}
        run: |
          printf '\n[Download E2E reports, screenshots and traces](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

  national:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Download current Swiss timetable sources
        id: sources
        continue-on-error: true
        run: |
          curl --fail --location --retry 3 \
            "https://data.opentransportdata.swiss/en/dataset/timetable-${{ needs.check.outputs.timetable_year }}-gtfs2020/permalink" \
            --output "$RUNNER_TEMP/swiss-gtfs.zip"
          curl --fail --location --retry 3 \
            "https://data.geo.admin.ch/ch.bav.schienennetz/schienennetz/schienennetz_2056_de.xtf" \
            --output "$RUNNER_TEMP/schienennetz_2056_de.xtf"
          unzip -t "$RUNNER_TEMP/swiss-gtfs.zip" >/dev/null

      - name: Build today's Swiss timetable
        if: steps.sources.outcome == 'success'
        run: |
          npm run data:gtfs -- \
            --archive "$RUNNER_TEMP/swiss-gtfs.zip" \
            --date "${{ needs.check.outputs.service_date }}"
          npm run data:day -- \
            --archive "$RUNNER_TEMP/swiss-gtfs.zip" \
            --date "${{ needs.check.outputs.service_date }}"
          npm run data:postbus:national -- \
            --archive "$RUNNER_TEMP/swiss-gtfs.zip" \
            --date "${{ needs.check.outputs.service_date }}"
          npm run data:postbus:roads
          node scripts/audit-postbus.mjs
          npm run data:rail:shapes -- \
            --source "$RUNNER_TEMP/schienennetz_2056_de.xtf" \
            --tolerance 160
          npm run data:rail:shapes -- \
            --source "$RUNNER_TEMP/schienennetz_2056_de.xtf" \
            --snapshot public/data/swiss-rail-day-manifest.json \
            --tolerance 160
          npm run data:mountains -- --archive "$RUNNER_TEMP/swiss-gtfs.zip"

      - name: Retain published timetable when the source download is unavailable
        if: steps.sources.outcome == 'failure'
        run: |
          echo '::warning::Official timetable download unavailable; retaining the last verified published national timetable with its original service date.'
          node scripts/restore-published-national-data.mjs

      - name: Upload national timetable
        uses: actions/upload-artifact@v7
        with:
          name: national-timetable
          retention-days: 2
          if-no-files-found: error
          path: |
            public/data/swiss-rail-morning.json
            public/data/swiss-rail-day-manifest.json
            public/data/swiss-rail-day-chunks/
            public/data/swiss-hub-day.json
            public/data/swiss-cogwheel-catalogue.json
            public/data/postbus-national-day-manifest.json
            public/data/postbus-national-day-chunks/

  regional:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Download regional timetable and geometry sources
        id: sources
        continue-on-error: true
        run: node scripts/download-regional-sources.mjs "$RUNNER_TEMP/regional-sources" "${{ needs.check.outputs.service_date }}"
      - name: Build and validate today's regional studies
        if: steps.sources.outcome == 'success'
        run: |
          npm run data:regional:days -- \
            --archive "$RUNNER_TEMP/regional-sources/swiss-gtfs.zip" \
            --zvv "$RUNNER_TEMP/regional-sources/zvv.zip" \
            --tpg "$RUNNER_TEMP/regional-sources/tpg.geojson" \
            --rail "$RUNNER_TEMP/regional-sources/rail.xtf" \
            --source-catalogue "$RUNNER_TEMP/regional-sources/sources.json" \
            --date "${{ needs.check.outputs.service_date }}" \
            --output-directory "$RUNNER_TEMP/regional-data"
      - name: Retain verified published regions when sources are unavailable
        if: steps.sources.outcome == 'failure'
        run: |
          echo '::warning::Regional source download unavailable; retaining verified published regional timetables with their original dates.'
          node scripts/restore-published-regional-data.mjs "$RUNNER_TEMP/regional-data"
      - name: Upload regional timetable
        uses: actions/upload-artifact@v7
        with:
          name: regional-timetable
          path: ${{ runner.temp }}/regional-data/
          retention-days: 2
          if-no-files-found: error

  build:
    needs: [national, regional]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Assemble verified timetables
        uses: actions/download-artifact@v8
        with:
          pattern: '*-timetable'
          merge-multiple: true
          path: public/data

      - name: Verify assembled regional timetables
        run: node scripts/regional-artifacts.mjs public/data

      - name: Enable compatible realtime service
        run: |
          node scripts/configure-live-pages.mjs \
            --endpoint https://gleislicht-realtime.louis-emmett.workers.dev \
            --snapshot public/data/swiss-rail-morning.json \
            --github-env "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Check mobile bundle budget
        run: npm run check:bundle

      - name: Apply publication gates
        run: npm run pages:prepare

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, e2e]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
