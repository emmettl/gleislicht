name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check edition boundaries
        run: npm run check:architecture

      - name: Check realtime edge adapter
        run: npm run worker:check && npm run worker:build

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit

      - name: Browser regression tests
        id: e2e
        env:
          E2E_SUITE: Gleislicht
        run: npm run test:e2e:ci
      - name: Upload E2E report, screenshots and traces
        id: e2e-report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Link E2E report in run summary
        if: ${{ !cancelled() && steps.e2e-report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.e2e-report.outputs.artifact-url }}
        run: |
          printf '\n[Download E2E reports, screenshots and traces](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

      # Keep the browser suite on the committed demo fixtures. The live
      # timetable deliberately has a different feed version until the
      # compatibility gate below approves its realtime counterpart.
      - name: Resolve current Swiss service date
        id: edition
        shell: bash
        run: |
          service_date="$(TZ=Europe/Zurich date +%F)"
          calendar_year="${service_date%%-*}"
          month_day="${service_date:5:2}${service_date:8:2}"
          timetable_year="$calendar_year"
          if [[ "$month_day" > "1212" ]]; then
            timetable_year="$((calendar_year + 1))"
          fi
          echo "service_date=$service_date" >> "$GITHUB_OUTPUT"
          echo "timetable_year=$timetable_year" >> "$GITHUB_OUTPUT"

      - name: Download current Swiss timetable sources
        id: sources
        continue-on-error: true
        run: |
          curl --fail --location --retry 3 \
            "https://data.opentransportdata.swiss/en/dataset/timetable-${{ steps.edition.outputs.timetable_year }}-gtfs2020/permalink" \
            --output "$RUNNER_TEMP/swiss-gtfs.zip"
          curl --fail --location --retry 3 \
            "https://data.geo.admin.ch/ch.bav.schienennetz/schienennetz/schienennetz_2056_de.xtf" \
            --output "$RUNNER_TEMP/schienennetz_2056_de.xtf"
          unzip -t "$RUNNER_TEMP/swiss-gtfs.zip" >/dev/null

      - name: Build today's Swiss timetable
        if: steps.sources.outcome == 'success'
        run: |
          npm run data:gtfs -- \
            --archive "$RUNNER_TEMP/swiss-gtfs.zip" \
            --date "${{ steps.edition.outputs.service_date }}"
          npm run data:day -- \
            --archive "$RUNNER_TEMP/swiss-gtfs.zip" \
            --date "${{ steps.edition.outputs.service_date }}"
          npm run data:rail:shapes -- \
            --source "$RUNNER_TEMP/schienennetz_2056_de.xtf" \
            --tolerance 160
          npm run data:rail:shapes -- \
            --source "$RUNNER_TEMP/schienennetz_2056_de.xtf" \
            --snapshot public/data/swiss-rail-day-manifest.json \
            --tolerance 160

      - name: Retain published timetable when the source download is unavailable
        if: steps.sources.outcome == 'failure'
        run: |
          echo '::warning::Official timetable download unavailable; retaining the last verified published national timetable with its original service date.'
          node scripts/restore-published-national-data.mjs

      - name: Enable compatible realtime service
        run: |
          node scripts/configure-live-pages.mjs \
            --endpoint https://gleislicht-realtime.louis-emmett.workers.dev \
            --snapshot public/data/swiss-rail-morning.json \
            --github-env "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Check mobile bundle budget
        run: npm run check:bundle

      - name: Apply publication gates
        run: npm run pages:prepare

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
