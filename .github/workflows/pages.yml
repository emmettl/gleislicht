name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check edition boundaries
        run: npm run check:architecture

      - name: Check realtime edge adapter
        run: npm run worker:check && npm run worker:build

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit

      - name: Browser regression tests
        run: npm run test:e2e:ci

      - name: Build
        run: npm run build

      - name: Check mobile bundle budget
        run: npm run check:bundle

      - name: Check All Change fixture budget
        run: npm run check:london

      - name: Check Local / Express corridor proof
        run: npm run check:new-york

      - name: Check Correspondances proof
        run: npm run check:paris

      - name: Apply publication gates
        run: npm run pages:prepare

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
