name: Check public freshness

on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [Publish to Cloudflare]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-freshness
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check public app, prepared dates, movement data and realtime pairing
        run: node scripts/check-public-freshness.mjs
