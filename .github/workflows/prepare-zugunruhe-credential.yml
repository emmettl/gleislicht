name: Prepare Zugunruhe deployment credential
on: workflow_dispatch
permissions:
  contents: read
jobs:
  encrypt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-pilot
    steps:
      - name: Install sealed-box encryption library
        run: npm install --prefix "$RUNNER_TEMP/credential-transfer" --ignore-scripts --no-audit --no-fund libsodium-wrappers@0.7.15
      - name: Encrypt only for Zugunruhe's deployment environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DESTINATION_PUBLIC_KEY: muLSHLpknGLDxUw6pceFe47hM3QK8PlXNuPMM8idWCk=
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const sodium = require(process.env.RUNNER_TEMP + '/credential-transfer/node_modules/libsodium-wrappers');
          sodium.ready.then(() => {
            if (!process.env.CLOUDFLARE_API_TOKEN) throw new Error('Missing deployment credential');
            const encrypted = {
              repository: 'emmettl/zugunruhe', environment: 'cloudflare', key_id: '3380204578043523366',
              encrypted_value: sodium.to_base64(sodium.crypto_box_seal(
                sodium.from_string(process.env.CLOUDFLARE_API_TOKEN),
                sodium.from_base64(process.env.DESTINATION_PUBLIC_KEY, sodium.base64_variants.ORIGINAL)
              ), sodium.base64_variants.ORIGINAL)
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + '/encrypted-zugunruhe.json', JSON.stringify(encrypted));
          });
          JS
      - name: Return only the encrypted credential
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-zugunruhe
          path: ${{ runner.temp }}/encrypted-zugunruhe.json
          retention-days: 1
