<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><rect width="960" height="580" fill="#f7f8fa"/><style>text{font-family:Arial,sans-serif;fill:#243342}.title{font-size:25px;font-weight:bold}.body{font-size:17px}.small{font-size:14px}</style><text x="32" y="42" class="title">Dietikon 1921: two axes, unresolved detector mapping</text><text x="32" y="73" class="body">Official LV95 geometry • local view • no travel direction inferred</text><defs><clipPath id="map"><rect x="32" y="100" width="440" height="410"/></clipPath></defs><rect x="32" y="100" width="440" height="410" fill="white" stroke="#bcc8cf"/><g clip-path="url(#map)"><polyline points="-410.88,1195.34 -343.65,1145.24 -161.59,907.91 -77.71,798.30 -8.13,698.22 82.42,578.12 256.85,353.18 364.55,214.02 609.81,-105.38" fill="none" stroke="#176e9c" stroke-width="5"/><line x1="260" y1="310" x2="278.925718838349" y2="324.64769723825157" stroke="#176e9c" stroke-width="2" stroke-dasharray="3 3"/><polyline points="563.23,-140.14 320.07,185.46 208.79,331.78 29.50,564.65 -271.38,943.83 -392.97,1104.57 -410.88,1195.34" fill="none" stroke="#ae5523" stroke-width="5"/><line x1="260" y1="310" x2="238.0485186111182" y2="293.3048209012486" stroke="#ae5523" stroke-width="2" stroke-dasharray="3 3"/><circle cx="260" cy="310" r="7" fill="#243342" stroke="white" stroke-width="2"/></g><text x="56" y="136" class="body">N ↑</text><line x1="56" y1="476" x2="116" y2="476" stroke="#243342" stroke-width="3"/><text x="56" y="498" class="small">10 m</text><text x="504" y="135" class="title">Station point between axes</text><text x="504" y="173" class="body">● 1921 public station point</text><text x="504" y="209" class="body" style="fill:#176e9c">Blue: ZH 618 — 3.99 m from point</text><text x="504" y="241" class="body" style="fill:#ae5523">Orange: ZH 618.1 — 4.6 m from point</text><text x="504" y="285" class="body">Two lanes labelled toward Dietikon</text><text x="504" y="315" class="body">Two lanes labelled toward Autobahn A1</text><text x="504" y="355" class="small">Labels are not assigned to either coloured axis.</text><text x="504" y="395" class="body">Oetwil 0214 also needs direction evidence.</text><text x="504" y="438" class="body">245 complete minutes ≠ approved section</text><text x="504" y="476" class="small">Source: Kanton Zürich WFS, pinned September 2026</text><text x="32" y="550" class="small">Diagnostic only. The station point is unchanged; dotted lines show nearest projections, not vehicle paths.</text></svg>
