d overall for anonymous use.\n        &lt;/p&gt;\n&lt;p&gt;\n            If the set number of requests within a certain time is exceeded, the account will be blocked until the beginning of a new time period.\n        &lt;/p&gt;\n&lt;p&gt;\n            The request limit can be viewed in the\n            &lt;a href=&quot;https://data.sbb.ch/account/quota/&quot;&gt;\n                user profile\n            &lt;/a&gt;\n            .\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n&lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                4. Obligations of data customers\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                4.1. Citing sources\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            The URL data.sbb.ch must be cited as the source for raw data in publications and analyses.\n        &lt;/p&gt;\n&lt;p&gt;\n            If the data forms part of a database that has many different data sources and does not just use data from data.sbb, sbb.ch need only be cited once in the list of sources contributing to this database. An indirect citation that mentions the database publisher citing sbb.ch will suffice. SBB decides whether data can be classified as a \u201cdatabase\u201d and this classification can be requested at\n            &lt;a href=&quot;mailto:data@sbb.ch&quot;&gt;\n                data@sbb.ch\n            &lt;/a&gt;\n            . SBB keeps a list of authorised databases.\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                4.2 Updating raw data\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            In the case of data processed for publications, the data user undertakes to regularly update the underlying raw data in a manner appropriate to its intended use.\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                4.3 Authorship\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            Processed data and analyses must be published under the name of the data user.\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                5. Links and comments\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            The pages and comments on data.sbb.ch may contain links to third-party websites, whose content SBB cannot control. SBB cannot provide any assurances or take any responsibility for this external content.\n        &lt;/p&gt;\n&lt;p&gt;\n            SBB monitors third-party entries and comments on data.sbb.ch to check whether they comply with the rules of\n            &lt;a href=&quot;https://www.sbb.ch/de/meta/netiquette.html&quot;&gt;\n                netiquette\n            &lt;/a&gt;\n            . Any entries that violate the rules of netiquette shall be removed by the webmaster. Comments published always represent the author\u2019s opinion and never that of SBB.\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                6. Liability and guarantee\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            SBB AG accepts no liability for damage or loss of any kind caused by the use of the data. It provides no guarantee that the published raw data, links and comments are up to date, correct, complete or accurate.\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                7. Misuse\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            Any misuse of the data shall immediately result in the relevant data user being banned from using any more data.\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                8. Amendments and addenda\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            SBB reserves the right to amend or add to these terms and conditions of use at any time.\n        &lt;/p&gt;\n&lt;p&gt;\n&lt;strong&gt;\n                9. Data protection\n            &lt;/strong&gt;\n&lt;/p&gt;\n&lt;p&gt;\n            SBB AG\u2019s\n            &lt;a href=&quot;https://www.sbb.ch/de/meta/legallines/datenschutz.html&quot;&gt;\n                Privacy Policy\n            &lt;/a&gt;\n
